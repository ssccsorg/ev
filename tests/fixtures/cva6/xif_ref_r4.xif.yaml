# CVA6 CV-X-IF encoding space — R4 format (func2 = bits[26:25], rs3 = bits[31:27]).
#
# Derived from the CVA6 hardware decoder mask table at commit 6544a714c:
#   - cva6/core/cvxif_example/include/cvxif_instr_pkg.sv (CoproInstr entries)
#   - cva6/core/cvxif_example/instr_decoder.sv (sel = (mask & instr) == pattern)
#
# Hardware-accepted custom-3 (0x7B) encodings in R4 field terms:
#   funct3=000, func2=00:   NOP          (writeback=0)
#   funct3=001, func2=00:   ADD
#   funct3=001, func2=01:   DOUBLE_RS1
#   funct3=001, func2=10:   DOUBLE_RS2
#   funct3=001, func2=11:   ADD_MULTI
#   funct3=001, rs3[0]=1:   ADD_RS3_R (not modeled: rs3 is fixed to 0)
#
# The NOP entry mask checks all funct7 bits, which in R4 terms are func2
# (bits[26:25]) plus rs3 (bits[31:27]); funct3=000 therefore accepts func2=00
# with rs3=0 only. rs3 is not a modeled field and is fixed to 0, so ADD_RS3_R
# (rs3[0]=1) is not representable and passes through as ADD.
#
# The DV class (cvxif_custom_instr.sv) additionally generates encodings that
# the reference coprocessor decoder does NOT accept (CUS_U_ADD, CUS_S_ADD,
# CUS_ADD_MULTI at funct3=000 with funct7 in {2,6,8}, and CUS_EXC at
# funct3=010); those are excluded here and documented as a DV/decoder
# divergence.
#
# No enable_mask constraints; every register combination is a valid encoding.

target: cva6_xif_ref_r4
encoding: r4
fields:
  funct3:
    range: [0, 7]
  func2:
    range: [0, 3]
  rs1:
    range: [0, 3]
  rs2:
    range: [0, 31]
  rd:
    range: [0, 3]
constraints:
  - type: oneof
    field: "funct3"
    values: [0, 1]
  - type: cross
    field_a: "funct3"
    field_b: "func2"
    mapping:
      0: [0]
      1: [0, 1, 2, 3]
projector:
  type: sum
