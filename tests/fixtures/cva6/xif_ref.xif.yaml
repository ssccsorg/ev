# CVA6 CV-X-IF encoding space — full register range (33M).
#
# Derived from the CVA6 hardware decoder mask table:
#   - cva6/core/cvxif_example/include/cvxif_instr_pkg.sv (CoproInstr entries)
#   - cva6/core/cvxif_example/instr_decoder.sv (sel = (mask & instr) == pattern)
# Cross-checked at CVA6 commit 6544a714c (master).
#
# Hardware-accepted custom-3 (0x7B) encodings:
#   funct3=000, funct7=0:   NOP          (writeback=0)
#   funct3=001, funct7=0:   ADD
#   funct3=001, funct7=1:   DOUBLE_RS1
#   funct3=001, funct7=2:   DOUBLE_RS2
#   funct3=001, funct7=3:   ADD_MULTI
#   funct3=001, funct7=4:   ADD_RS3_R
#
# The NOP entry mask checks all funct7 bits (1111111), so funct3=000 accepts
# funct7=0 only. The DV class (cvxif_custom_instr.sv) additionally generates
# encodings (CUS_U_ADD funct7=2, CUS_S_ADD funct7=6, CUS_ADD_MULTI funct7=8
# at funct3=000, and CUS_EXC funct3=010 funct7=96) that the reference
# coprocessor decoder does NOT accept; those are excluded here and documented
# as a DV/decoder divergence.
#
# No enable_mask constraints: the hardware accepts all register combinations
# for the encodings above. Register semantics differ per instruction, but
# every register combination is a valid encoding.

target: cva6_xif_ref
fields:
  funct3:
    range: [0, 7]
  funct7:
    range: [0, 127]
  rs1:
    range: [0, 31]
  rs2:
    range: [0, 31]
  rd:
    range: [0, 31]
constraints:
  - type: oneof
    field: "funct3"
    values: [0, 1]
  - type: cross
    field_a: "funct3"
    field_b: "funct7"
    mapping:
      0: [0]
      1: [0, 1, 2, 3, 4]
projector:
  type: sum
